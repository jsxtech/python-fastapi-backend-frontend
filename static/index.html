<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Frontend</title>
    <style>
        body { font-family: Arial; max-width: 1000px; margin: 20px auto; }
        input, textarea, select { display: block; margin: 5px 0; padding: 8px; width: 300px; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; background: #2196F3; color: white; border: none; border-radius: 4px; }
        button:hover { background: #1976D2; }
        .item { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; background: white; }
        .item.out-of-stock { opacity: 0.6; background: #ffebee; }
        .item.low-stock { background: #fff3e0; }
        .error { color: red; }
        .success { color: green; }
        .stats { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; margin: 10px 0; border-radius: 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; cursor: pointer; transition: transform 0.2s; }
        .stats:hover { transform: scale(1.02); }
        .stat-item { text-align: center; }
        .stat-value { font-size: 2em; font-weight: bold; }
        .filters { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .login-form { max-width: 300px; margin: 100px auto; padding: 30px; border: 1px solid #ddd; border-radius: 8px; }
        .hidden { display: none; }
        .tag { display: inline-block; background: #e3f2fd; padding: 3px 8px; margin: 2px; border-radius: 3px; font-size: 0.85em; }
        .notification { position: fixed; top: 20px; right: 20px; background: #4caf50; color: white; padding: 15px; border-radius: 5px; animation: slideIn 0.3s; z-index: 1000; }
        @keyframes slideIn { from { transform: translateX(400px); } to { transform: translateX(0); } }
        .chart { background: white; padding: 20px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; }
        .bar { background: #2196F3; height: 20px; margin: 5px 0; border-radius: 3px; }
        .activity-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 0.9em; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; }
        .modal-content { background: white; margin: 50px auto; padding: 30px; max-width: 800px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
        body.dark-mode { background: #1a1a1a; color: #e0e0e0; }
        body.dark-mode .item { background: #2d2d2d; border-color: #444; }
        body.dark-mode .stats { background: linear-gradient(135deg, #434343 0%, #000000 100%); }
        body.dark-mode .filters, body.dark-mode .chart { background: #2d2d2d; border-color: #444; }
        body.dark-mode input, body.dark-mode select, body.dark-mode textarea { background: #3d3d3d; color: #e0e0e0; border-color: #555; }
        body.dark-mode .modal-content { background: #2d2d2d; color: #e0e0e0; }
        @media print { button, .filters, .stats { display: none !important; } }
    </style>
</head>
<body>
    <div id="loginSection" class="login-form">
        <h2>Login</h2>
        <input id="username" placeholder="Username" value="admin">
        <input id="password" type="password" placeholder="Password" value="admin123">
        <button onclick="login()">Login</button>
        <div id="loginError" class="error"></div>
    </div>

    <div id="appSection" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>FastAPI Inventory Manager</h1>
            <div>
                <span id="usernameDisplay" style="margin-right: 10px;"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    
    <div class="stats" id="stats" onclick="loadStats()"></div>
    
    <h2>Add/Edit Item</h2>
    <input id="name" placeholder="Name">
    <input id="price" type="number" placeholder="Price" step="0.01" min="0">
    <input id="quantity" type="number" placeholder="Quantity" value="0" min="0">
    <textarea id="description" placeholder="Description"></textarea>
    <input id="category" placeholder="Category">
    <input id="tags" placeholder="Tags (comma separated)">
    <label><input id="in_stock" type="checkbox" checked> In Stock</label>
    <button onclick="saveItem()">Save</button>
    <button onclick="clearForm()">Clear</button>
    <div id="error" class="error"></div>
    
    <div class="filters">
        <h3>Filters & Sort</h3>
        <input id="search" placeholder="Search items" oninput="applyFilters()">
        <select id="categoryFilter" onchange="applyFilters()">
            <option value="">All Categories</option>
        </select>
        <select id="sort" onchange="applyFilters()">
            <option value="">Default</option>
            <option value="name">Name</option>
            <option value="price_asc">Price (Low to High)</option>
            <option value="price_desc">Price (High to Low)</option>
        </select>
        <input id="minQty" type="number" placeholder="Min Quantity" oninput="applyFilters()">
        <input id="maxQty" type="number" placeholder="Max Quantity" oninput="applyFilters()">
        <input id="tagFilter" placeholder="Filter by tags" oninput="applyFilters()">
    </div>
    
    <h2>Items</h2>
    <button onclick="showLowStock()">Low Stock Alert</button>
    <button onclick="showAnalytics()">Analytics</button>
    <button onclick="showActivity()">Activity Log</button>
    <button onclick="showReports()">Reports</button>
    <button onclick="printItems()">Print</button>
    <button onclick="exportData()">Export JSON</button>
    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="exportPDF()">Export PDF</button>
    <button onclick="toggleBulkMode()">Bulk Edit</button>
    <button onclick="scheduleBackup()">Backup Now</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData()">
    <button onclick="document.getElementById('importFile').click()">Import JSON</button>
    <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    
    <div id="bulkActions" class="hidden" style="background: #fff3cd; padding: 10px; margin: 10px 0; border-radius: 5px;">
        <strong>Bulk Actions:</strong>
        <button onclick="bulkUpdateStock(true)">Mark In Stock</button>
        <button onclick="bulkUpdateStock(false)">Mark Out of Stock</button>
        <button onclick="clearSelection()">Clear Selection</button>
        <span id="selectedCount"></span>
    </div>
    
    <div id="items"></div>
    </div>

    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 id="modalTitle"></h2>
                <button onclick="closeModal()">Close</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let editingId = null;
        let token = null;
        let ws = null;
        let bulkMode = false;
        let selectedItems = new Set();

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error('Login failed');
                }
                return res.json();
            })
            .then(data => {
                token = data.token;
                localStorage.setItem('token', token);
                localStorage.setItem('username', data.username);
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                initApp();
            })
            .catch(() => {
                document.getElementById('loginError').textContent = 'Invalid credentials';
            });
        }

        function logout() {
            token = null;
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('appSection').classList.add('hidden');
            if (ws) ws.close();
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function initApp() {
            document.getElementById('usernameDisplay').textContent = localStorage.getItem('username') || 'User';
            fetchItems();
            loadStats();
            loadCategories();
            connectWebSocket();
        }

        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                showNotification(data.message);
                fetchItems();
                loadStats();
            };
            ws.onclose = () => {
                // Reconnect after 3 seconds if not a manual logout
                if (token) {
                    setTimeout(connectWebSocket, 3000);
                }
            };
            ws.onerror = () => {
                ws.close();
            };
        }

        function showNotification(message) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        async function authFetch(url, options = {}) {
            const res = await fetch(url, options);
            if (res.status === 401 || res.status === 403) {
                // Token expired or invalid - force re-login
                logout();
                showNotification('Session expired. Please log in again.');
                throw new Error('Unauthorized');
            }
            return res;
        }

        if (localStorage.getItem('token')) {
            token = localStorage.getItem('token');
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            initApp();
        }
        
        initTheme();

        async function saveItem() {
            const name = document.getElementById('name').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            const quantity = parseInt(document.getElementById('quantity').value) || 0;
            const description = document.getElementById('description').value;
            const category = document.getElementById('category').value || 'General';
            const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t);
            const in_stock = document.getElementById('in_stock').checked;
            
            if (!name || isNaN(price) || price < 0) {
                document.getElementById('error').textContent = 'Name required and price must be a non-negative number';
                return;
            }

            try {
                const method = editingId ? 'PUT' : 'POST';
                const url = editingId ? `/api/items/${editingId}` : '/api/items';
                const res = await authFetch(url, {
                    method,
                    headers: getHeaders(),
                    body: JSON.stringify({name, price, quantity, description, category, tags, in_stock})
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => null);
                    document.getElementById('error').textContent = err?.detail || `Error: ${res.status}`;
                    return;
                }
                clearForm();
                fetchItems();
                loadStats();
                loadCategories();
            } catch (e) {
                if (e.message !== 'Unauthorized') {
                    document.getElementById('error').textContent = 'Network error saving item';
                }
            }
        }

        function clearForm() {
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
            document.getElementById('quantity').value = '0';
            document.getElementById('description').value = '';
            document.getElementById('category').value = '';
            document.getElementById('tags').value = '';
            document.getElementById('in_stock').checked = true;
            document.getElementById('error').textContent = '';
            editingId = null;
        }

        async function showLowStock() {
            const res = await fetch('/api/low-stock');
            const data = await res.json();
            if (data.length === 0) {
                alert('No low stock items!');
            } else {
                alert(`Low Stock Items (${data.length}):\n` + data.map(i => `${i.name}: ${i.quantity}`).join('\n'));
            }
        }

        async function exportCSV() {
            window.location.href = '/api/export/csv';
        }

        function toggleBulkMode() {
            bulkMode = !bulkMode;
            document.getElementById('bulkActions').classList.toggle('hidden');
            selectedItems.clear();
            fetchItems();
        }

        function toggleSelect(id) {
            if (selectedItems.has(id)) {
                selectedItems.delete(id);
            } else {
                selectedItems.add(id);
            }
            document.getElementById('selectedCount').textContent = `${selectedItems.size} selected`;
        }

        function clearSelection() {
            selectedItems.clear();
            fetchItems();
        }

        async function bulkUpdateStock(inStock) {
            if (selectedItems.size === 0) {
                alert('No items selected');
                return;
            }
            await authFetch('/api/bulk-update', {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({
                    item_ids: Array.from(selectedItems),
                    updates: {in_stock: inStock}
                })
            });
            selectedItems.clear();
            fetchItems();
        }

        async function duplicateItem(id) {
            await authFetch(`/api/duplicate/${id}`, {method: 'POST', headers: getHeaders()});
            fetchItems();
            loadStats();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        async function showAnalytics() {
            const res = await fetch('/api/analytics');
            const data = await res.json();
            
            document.getElementById('modalTitle').textContent = 'Analytics Dashboard';
            document.getElementById('modalBody').innerHTML = `
                <div class="chart">
                    <h3>Price Distribution</h3>
                    ${Object.entries(data.price_distribution).map(([range, count]) => 
                        `<div><strong>$${escapeHtml(range)}:</strong> ${count} items
                        <div class="bar" style="width: ${count * 20}px"></div></div>`
                    ).join('')}
                </div>
                <div class="chart">
                    <h3>Stock Status</h3>
                    <div>In Stock: ${data.stock_status.in_stock}</div>
                    <div>Out of Stock: ${data.stock_status.out_of_stock}</div>
                </div>
                <div class="chart">
                    <h3>Recent Activity</h3>
                    ${data.recent_activity.map(a => 
                        `<div class="activity-item">${escapeHtml(a.action)} - ${escapeHtml(a.item)} (${new Date(a.timestamp).toLocaleString()})</div>`
                    ).join('')}
                </div>
            `;
            document.getElementById('modal').style.display = 'block';
        }

        async function showActivity() {
            const res = await fetch('/api/activity');
            const data = await res.json();
            
            document.getElementById('modalTitle').textContent = 'Activity Log';
            document.getElementById('modalBody').innerHTML = data.map(a => 
                `<div class="activity-item">
                    <strong>${escapeHtml(a.action)}</strong> - ${escapeHtml(a.item)}<br>
                    <small>${new Date(a.timestamp).toLocaleString()}</small>
                </div>`
            ).join('');
            document.getElementById('modal').style.display = 'block';
        }

        async function showReports() {
            const res = await fetch('/api/reports/summary');
            const data = await res.json();
            
            document.getElementById('modalTitle').textContent = 'Summary Report';
            document.getElementById('modalBody').innerHTML = `
                <div class="chart">
                    <h3>Overview</h3>
                    <p>Total Items: <strong>${data.total_items}</strong></p>
                    <p>Total Inventory Value: <strong>$${data.total_value.toFixed(2)}</strong></p>
                    <p>Average Price: <strong>$${data.average_price.toFixed(2)}</strong></p>
                    <p>Low Stock Items: <strong>${data.low_stock_count}</strong></p>
                </div>
                <div class="chart">
                    <h3>Top Categories by Value</h3>
                    ${Object.entries(data.top_categories).map(([cat, info]) => 
                        `<div><strong>${escapeHtml(cat)}:</strong> ${info.count} items, $${info.value.toFixed(2)}
                        <div class="bar" style="width: ${info.value / 10}px; background: #ff9800;"></div></div>`
                    ).join('')}
                </div>
            `;
            document.getElementById('modal').style.display = 'block';
        }

        function printItems() {
            window.print();
        }

        async function exportPDF() {
            const res = await fetch('/api/export/pdf');
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'inventory.pdf';
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }

        function initTheme() {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
            }
        }

        async function scheduleBackup() {
            await authFetch('/api/backup/schedule', {method: 'POST', headers: getHeaders()});
            showNotification('Backup scheduled');
        }

        function editItem(item) {
            document.getElementById('name').value = item.name;
            document.getElementById('price').value = item.price;
            document.getElementById('quantity').value = item.quantity || 0;
            document.getElementById('description').value = item.description || '';
            document.getElementById('category').value = item.category || '';
            document.getElementById('tags').value = (item.tags || []).join(', ');
            document.getElementById('in_stock').checked = item.in_stock;
            editingId = item.id;
        }

        async function deleteItem(id) {
            if (confirm('Delete this item?')) {
                await authFetch(`/api/items/${id}`, {method: 'DELETE', headers: getHeaders()});
                fetchItems();
                loadStats();
            }
        }

        async function applyFilters() {
            const search = document.getElementById('search').value;
            const category = document.getElementById('categoryFilter').value;
            const sort = document.getElementById('sort').value;
            const minQty = document.getElementById('minQty').value;
            const maxQty = document.getElementById('maxQty').value;
            const tags = document.getElementById('tagFilter').value;
            
            const params = new URLSearchParams();
            if (search) params.set('q', search);
            if (minQty) params.set('min_qty', minQty);
            if (maxQty) params.set('max_qty', maxQty);
            if (tags) params.set('tags', tags);
            
            let res = await fetch(`/api/search/advanced?${params.toString()}`);
            let data = await res.json();
            
            if (category) data = data.filter(i => i.category === category);
            
            if (sort === "price_asc") data.sort((a, b) => a.price - b.price);
            else if (sort === "price_desc") data.sort((a, b) => b.price - a.price);
            else if (sort === "name") data.sort((a, b) => a.name.localeCompare(b.name));
            
            renderItems(data);
        }

        async function fetchItems() {
            const res = await fetch('/api/items');
            const data = await res.json();
            renderItems(data);
        }

        async function loadStats() {
            const res = await fetch('/api/stats');
            const stats = await res.json();
            document.getElementById('stats').innerHTML = `
                <div class="stat-item"><div class="stat-value">${stats.total}</div><div>Total Items</div></div>
                <div class="stat-item"><div class="stat-value">${stats.in_stock}</div><div>In Stock</div></div>
                <div class="stat-item"><div class="stat-value">$${stats.total_value.toFixed(2)}</div><div>Total Value</div></div>
                <div class="stat-item"><div class="stat-value">${stats.low_stock}</div><div>Low Stock</div></div>
                <div class="stat-item"><div class="stat-value">$${stats.avg_price.toFixed(2)}</div><div>Avg Price</div></div>
            `;
            document.getElementById('stats').title = 'Click to refresh';
        }

        async function loadCategories() {
            const res = await fetch('/api/categories');
            const cats = await res.json();
            const select = document.getElementById('categoryFilter');
            select.innerHTML = '<option value="">All Categories</option>' + 
                cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
        }

        let currentItems = [];

        function renderItems(data) {
            currentItems = data;
            if (data.length === 0) {
                document.getElementById('items').innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">No items found. Add your first item above!</p>';
                return;
            }
            document.getElementById('items').innerHTML = data.map((item, idx) => {
                const qty = item.quantity || 0;
                const lowStock = qty < 5 && qty > 0;
                const checked = selectedItems.has(item.id) ? 'checked' : '';
                return `<div class="item ${!item.in_stock ? 'out-of-stock' : ''} ${lowStock ? 'low-stock' : ''}">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        ${bulkMode ? `<input type="checkbox" ${checked} onchange="toggleSelect(${item.id})">` : ''}
                        <div style="flex: 1;">
                            <strong style="font-size: 1.2em;">${escapeHtml(item.name)}</strong> - $${item.price.toFixed(2)} 
                            <span style="color: #666">[${escapeHtml(item.category || 'General')}]</span>
                            <div style="margin: 5px 0;">Quantity: <strong>${qty}</strong> ${lowStock ? '⚠️ Low Stock' : ''} ${!item.in_stock ? '❌ Out of Stock' : '✅'}</div>
                            ${item.tags && item.tags.length ? '<div>' + item.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('') + '</div>' : ''}
                            ${item.description ? `<p style="color: #666;">${escapeHtml(item.description)}</p>` : ''}
                        </div>
                        <div>
                            <button onclick="editItem(currentItems[${idx}])">Edit</button>
                            <button onclick="duplicateItem(${item.id})" style="background: #ff9800;">Duplicate</button>
                            <button onclick="deleteItem(${item.id})" style="background: #f44336;">Delete</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function exportData() {
            const res = await fetch('/api/export');
            const data = await res.json();
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'items.json';
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function importData() {
            const file = document.getElementById('importFile').files[0];
            const formData = new FormData();
            formData.append('file', file);
            await authFetch('/api/import', {
                method: 'POST',
                headers: {'Authorization': `Bearer ${token}`},
                body: formData
            });
            fetchItems();
            loadStats();
            loadCategories();
        }

    </script>
</body>
</html>
